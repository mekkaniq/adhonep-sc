# ADHONEP-SC · publica o site no GitHub Pages SÓ com os arquivos do site (sem docs, SQL, testes, zips).
# Hoje o Pages publica a main inteira ("Deploy from a branch"), e por isso www.adhonepemsc.com.br/docs/BACKLOG.md abre.
# Para ativar (Eduardo, uma vez):
#   1) Settings → Pages → Build and deployment → Source: "GitHub Actions" (o domínio personalizado continua o mesmo)
#   2) Settings → Secrets and variables → Actions → aba Variables → New variable: PAGES_PELO_ACTIONS = sim
#   3) Actions → "Publicar site (GitHub Pages)" → Run workflow
# Enquanto a variável não existir, este workflow não faz nada (o Pages continua como hoje).
name: Publicar site (GitHub Pages)
on:
  push:
    branches: [main]
    # Só publica quando muda algo do site. Documentação, SQL, testes, app e workflows não vão para o ar
    # (mesma lista do .vercelignore), então mudar só eles não dispara publicação nem e-mail de falha.
    # Mudou este arquivo ou scripts/montar-site.py? Rodar à mão: Actions → "Publicar site" → Run workflow.
    paths-ignore:
      - '**.md'
      - '**.sql'
      - '**.zip'
      - '**.py'
      - '**.ts'
      - 'supabase/**'
      - 'testes/**'
      - 'loadtest/**'
      - 'docs/**'
      - 'scripts/**'
      - 'app/**'
      - '.github/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    if: vars.PAGES_PELO_ACTIONS == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (sem arquivos internos)
        run: python3 scripts/montar-site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # O GitHub às vezes falha ao achar o pacote recém-enviado ("Fetching artifact metadata failed").
      # É passageiro: espera e tenta de novo antes de dar erro (e mandar e-mail).
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
