name: Testes (banco e tela)
# Roda a cada push e pull request. Não usa segredos nem a produção:
# o banco é um Postgres novo montado só com o SQL do repositório; a tela usa o Supabase simulado.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash   # com pipefail: se o teste falhar, o passo falha mesmo usando tee
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  segredos:
    name: Segredos (gitleaks, histórico inteiro)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico inteiro: uma chave apagada depois continua no histórico
      - name: Instalar gitleaks 8.21.2 (conferido por checksum)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
      - name: Procurar chaves e senhas (regras em .gitleaks.toml)
        run: |
          ./gitleaks detect -c .gitleaks.toml --log-opts="--all" --redact --no-banner -v | tee resultado-segredos.txt
      - name: Resumo
        if: always()
        run: |
          { echo '### Segredos'; echo '```'; tail -n 30 resultado-segredos.txt 2>/dev/null || true; echo '```'
            echo 'Achou algo? Rotacionar a chave no painel (Supabase/Apple/Google) ANTES de apagar do código: o histórico guarda.'; } >> "$GITHUB_STEP_SUMMARY"
  banco:
    name: Banco (RLS e perfis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: teste
    steps:
      - uses: actions/checkout@v4
      - name: Testar banco
        run: |
          bash testes/banco/rodar.sh | tee resultado-banco.txt
      - name: Resumo
        if: always()
        run: |
          { echo '### Banco'; echo '```'; grep -E '^(OK|FAIL|==|RESULTADO)' resultado-banco.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  tela:
    name: Tela (Playwright, Supabase simulado)
    runs-on: ubuntu-24.04   # ubuntu-latest virou 26.04 e o Playwright do projeto ainda não roda nele
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright
        working-directory: testes
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Montar o site que vai para o ar (sem arquivos internos)
        run: |
          python3 scripts/montar-site.py _site
          internos=$(cd _site && find . -type f \( -name '*.md' -o -name '*.sql' -o -name '*.zip' -o -name '*.py' -o -name '*.ts' -o -name '*.yml' \) | head)
          if [ -n "$internos" ]; then echo "FAIL arquivos internos no site publicado:"; echo "$internos"; exit 1; fi
          echo "OK   site publicado sem documentação, SQL, testes ou zips"
      - name: Testar tela (na pasta publicada)
        working-directory: testes
        env:
          ADH_SITE: ../_site
        run: |
          node tela/rodar.js | tee ../resultado-tela.txt
      - name: Resumo
        if: always()
        run: |
          { echo '### Tela'; echo '```'; grep -E '^(OK|FAIL|==|RESULTADO)' resultado-tela.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
