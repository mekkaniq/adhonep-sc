<style>
/* Layout: uma cena em tela cheia — abertura de palavras ("Bem-vindo" em vários idiomas) que sobe numa curva e revela a marca sobre a Terra. Visual único, escuro por escolha. */
:root{
  --night:#050c18; --navy:#0b1b33; --navy-2:#14305a;
  --gold:#c9a45c; --gold-soft:#e6cf9c; --ink:#eef2f8; --mute:#94a6bf;
  --display:"Cormorant Garamond","Noto Serif","Noto Sans Arabic","Noto Sans Ethiopic","Noto Sans Armenian",Georgia,serif;
  --clean:"Inter Tight","Inter",system-ui,-apple-system,"SF Pro Display","Segoe UI","Noto Sans Arabic","Noto Sans Ethiopic","Noto Sans Armenian",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Noto Sans Ethiopic","Noto Sans Armenian",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}

/* ---------- cena final: a marca sobre a Terra ---------- */
.scene{position:absolute;inset:0;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.sky{position:absolute;inset:-4%;background:var(--night) url("assets/g/sky.jpg") center 55%/cover no-repeat;transform:scale(1.14);transition:transform 5.5s cubic-bezier(.2,.7,.2,1),filter 2s ease;filter:brightness(.55) saturate(1.05)}
.shade{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 45%,rgba(5,12,24,.15),rgba(5,12,24,.8))}
.revealed .sky{transform:scale(1.02);filter:brightness(.72) saturate(1.05)}
.brandwrap{position:relative;display:grid;justify-items:center;gap:clamp(18px,3vh,30px);text-align:center;max-width:100%}
.brand{display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.sym{height:clamp(120px,22vh,230px);width:auto;opacity:0;transform:scale(.86);transition:opacity 1s ease,transform 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 26px rgba(230,207,156,.35))}
.word{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(6px,1.1vh,12px);width:max-content}
.word img{height:clamp(34px,6.4vh,66px);width:auto;max-width:none;display:block}
.bn{display:block;font:600 16px/1 var(--body);letter-spacing:.34em;color:#c9a868;white-space:nowrap;margin-right:-.34em}
.wordbox{overflow:hidden;max-width:0;transition:max-width 1.3s cubic-bezier(.65,0,.25,1),margin 1.3s cubic-bezier(.65,0,.25,1)}
.wordbox .word{clip-path:inset(0 100% 0 0);transition:clip-path 1.3s cubic-bezier(.65,0,.25,1) .1s}
.s1 .sym{opacity:1;transform:scale(1)}
.s2 .wordbox{margin-left:clamp(14px,2.2vw,30px)}
.s2 .wordbox .word{clip-path:inset(0 0 0 0)}
.tag{font:500 clamp(22px,3.4vw,40px)/1.15 var(--display);color:var(--ink);letter-spacing:.01em;text-wrap:balance;opacity:0;transform:translateY(12px);transition:opacity .9s ease,transform .9s ease;min-height:1.2em}
.tag.swap{opacity:0!important;transform:translateY(6px)!important;transition-duration:.25s}
.rule{width:min(420px,60vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity 1s ease .2s}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;opacity:0;transform:translateY(10px);transition:opacity .9s ease .25s,transform .9s ease .25s}
.lang{font:600 13px/1 var(--body);letter-spacing:.06em;color:var(--ink);background:rgba(11,27,51,.55);border:1px solid rgba(201,164,92,.45);border-radius:999px;padding:10px 16px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s,color .2s,border-color .2s}
.lang:hover{border-color:var(--gold-soft)}
.lang[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--navy);border-color:transparent}
.lang:focus-visible,.replay:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.s3 .tag{opacity:1;transform:none}
.s3 .rule{opacity:.9}
.foot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:11.5px;color:var(--mute);opacity:0;transition:opacity 1s ease .6s}
.s3 .foot{opacity:1}
.replay{font:600 12px var(--body);color:var(--gold-soft);background:transparent;border:1px solid rgba(201,164,92,.4);border-radius:999px;padding:8px 14px;cursor:pointer}
.replay:hover{background:rgba(201,164,92,.12)}

/* ---------- abertura: "Bem-vindo" subindo em vários idiomas ---------- */
.intro{position:absolute;inset:0;z-index:5;will-change:transform}
.intro-bg{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 45%,#0d1e38,#060d1a 60%,#03070f)}
.curve{position:absolute;left:0;top:calc(100% - 1px);width:100%;height:24vh;display:block}
.curve path{fill:var(--night)}
.words{position:absolute;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{grid-area:1/1;display:grid;justify-items:center;gap:16px;text-align:center;opacity:0;transform:translateY(42%);filter:blur(10px);transition:opacity .38s ease,transform .5s cubic-bezier(.2,.8,.2,1),filter .45s ease;max-width:100%}
.w.on{opacity:1;transform:none;filter:none}
.w.off{opacity:0;transform:translateY(-46%);filter:blur(8px)}
.w b{display:block;font:400 clamp(42px,8.6vw,118px)/1.06 var(--clean);color:#fff;letter-spacing:-.035em;overflow-wrap:anywhere}
.w small{font:500 11px/1 var(--body);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.42)}
.w.fast{filter:none!important}
.w.fast:not(.on){transform:translateY(22%)}
.w.fast.off{transform:translateY(-24%)}
.count{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font:500 11px/1 var(--body);letter-spacing:.3em;color:var(--mute);text-transform:uppercase}
.count i{font-style:normal;color:var(--gold-soft);font-variant-numeric:tabular-nums}
.done .intro{pointer-events:none}

@media (max-width:640px){
  .brand{flex-direction:column}
  .s2 .wordbox{margin-left:0;margin-top:14px}
  .wordbox{max-width:none;max-height:0;transition:max-height 1.3s cubic-bezier(.65,0,.25,1),margin 1.3s cubic-bezier(.65,0,.25,1)}
  .word{align-items:center}
  .word img{height:auto;width:min(74vw,400px)}
  .foot{flex-direction:column;justify-content:center;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  .w,.sym,.wordbox,.wordbox .word,.tag,.langs,.rule,.foot,.sky{transition:none!important}
}

.enter{margin-top:6px;font:600 14px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--navy);background:linear-gradient(135deg,var(--gold-soft),var(--gold));border:0;border-radius:999px;padding:14px 30px;cursor:pointer;opacity:0;transform:translateY(10px);transition:opacity .9s ease .45s,transform .9s ease .45s,filter .2s;pointer-events:none}
.s3 .enter{opacity:1;transform:none;pointer-events:auto}.enter:hover{filter:brightness(1.08)}
.stage.gone{opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
html.app-on .stage{pointer-events:none}
</style>

<div class="stage" id="stage">

<script>
/* Abertura própria (inspirada no conceito de "preloader de palavras"; código original).
   Saudação de boas-vindas em idiomas da lista de países da ADHONEP / FGBMFI. */
const WORDS = [
  ["Bem-vindo","Português","pt"],["Bienvenido","Español","es"],["Welcome","English","en"],["Bienvenue","Français","fr"],
  ["Willkommen","Deutsch","de"],["Benvenuto","Italiano","it"],["Welkom","Nederlands","nl"],["Välkommen","Svenska","sv"],
  ["Tervetuloa","Suomi","fi"],["Vítejte","Čeština","cs"],["Üdvözöljük","Magyar","hu"],["Добро пожаловать","Русский","ru"],
  ["Ласкаво просимо","Українська","uk"],["Բարի գալուստ","Հայերեն","hy"],["Selamat datang","Bahasa Melayu","ms"],
  ["أهلاً وسهلاً","العربية","ar"],["እንኳን ደህና መጡ","አማርኛ","am"],["Karibu","Kiswahili","sw"],["Wamukelekile","isiZulu","zu"],
  ["Wamkelekile","isiXhosa","xh"],["Murakaza neza","Kinyarwanda","rw"],["Tongasoa","Malagasy","mg"],["Takulandirani","Chichewa","ny"],
  ["Boyei malamu","Lingála","ln"],["Dalal ak jàmm","Wolof","wo"],["Kaze neza","Ikirundi","rn"],["Eguahẽporãite","Avañe'ẽ","gn"],
  ["Bainvegni","Rumantsch","rm"],["Bem-vindo","Português","pt"]
];
const TAGS = {
  pt:"Uma comunhão que fala muitas línguas.",
  es:"Una comunión que habla muchos idiomas.",
  en:"One fellowship, many languages.",
  fr:"Une communion qui parle de nombreuses langues."
};
const $ = id => document.getElementById(id);
const stage = $("stage"), intro = $("intro"), words = $("words"), path = $("curvePath");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const total = WORDS.length - 1; // a última repete o português
let timers = [], raf = 0;
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
function clearAll(){ timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); }

words.innerHTML = WORDS.map(([w,l,c]) => `<div class="w" lang="${c}"${c==="ar"?' dir="rtl"':''}><b>${w}</b><small>${l}</small></div>`).join("");
const els = [...words.children];

/* ritmo: começa devagar e acelera, como quem passa por todo o mapa */
function durations(n){
  const d = [];
  for (let i = 0; i < n; i++){
    if (i === 0) d.push(900);
    else if (i === n - 1) d.push(1100);
    else d.push(Math.max(105, Math.round(560 * Math.pow(0.86, i - 1))));
  }
  return d;
}

function setStage(cls){ stage.classList.add(cls); }
function resetScene(){
  stage.classList.remove("s1","s2","s3","revealed","done");
  const wb = $("wordbox"); wb.style.maxWidth = ""; wb.style.maxHeight = "";
  intro.style.transform = ""; intro.style.display = "";
  path.setAttribute("d","M0 0 L1000 0 Q500 100 0 0 Z");
  els.forEach(e => { e.className = "w"; e.style.transition = ""; });
}

function fitBN(){
  const img = document.querySelector("#word img"), bn = $("bn"); if (!img || !bn) return;
  const w = img.getBoundingClientRect().width; if (!w) return;
  bn.style.fontSize = "16px"; const k = w / (bn.getBoundingClientRect().width || w);
  bn.style.fontSize = (16 * k).toFixed(2) + "px";
}
addEventListener("resize", fitBN);
function revealBrand(){
  fitBN();
  setStage("revealed"); setStage("s1");
  later(() => {
    const wb = $("wordbox"), img = $("word");
    if (matchMedia("(max-width:640px)").matches) wb.style.maxHeight = (img.getBoundingClientRect().height || 200) + 40 + "px";
    else wb.style.maxWidth = (img.getBoundingClientRect().width || 600) + 4 + "px";
    setStage("s2");
  }, 1150);
  later(() => setStage("s3"), 2300);
}

/* saída: a tela sobe e a borda de baixo faz uma curva que se endireita */
function lift(){
  const H = innerHeight, t0 = performance.now(), D = 1150;
  const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
  later(revealBrand, 380);
  (function step(now){
    const k = Math.min(1, (now - t0) / D), e = ease(k);
    intro.style.transform = `translateY(${-e * (H * 1.3)}px)`;
    const bulge = 100 * Math.sin(Math.min(1, k * 1.1) * Math.PI) * (1 - k * .35);
    path.setAttribute("d", `M0 0 L1000 0 Q500 ${bulge.toFixed(1)} 0 0 Z`);
    if (k < 1) raf = requestAnimationFrame(step);
    else { intro.style.display = "none"; setStage("done"); }
  })(t0);
}

function play(){
  clearAll(); resetScene();
  if (reduce){ fitBN(); intro.style.display = "none"; stage.classList.add("revealed","s1","s2","s3","done"); const wb=$("wordbox"); wb.style.maxWidth="none"; wb.style.maxHeight="none"; return; }
  const ds = durations(els.length); let t = 250;
  els.forEach((el, i) => {
    const dur = ds[i] / 1000, fast = ds[i] < 240;
    el.style.transition = `opacity ${Math.min(.38, dur * .7).toFixed(2)}s ease, transform ${Math.min(.5, dur * .9).toFixed(2)}s cubic-bezier(.2,.8,.2,1), filter ${Math.min(.45, dur * .7).toFixed(2)}s ease`;
    if (fast) el.classList.add("fast");
    later(() => {
      if (i > 0) els[i-1].className = "w off" + (ds[i] < 240 ? " fast" : "");
      el.className = "w on" + (fast ? " fast" : "");
    }, t);
    t += ds[i];
  });
  later(lift, t);
}

$("replay").addEventListener("click", play); window.__play = play;
window.addEventListener("load", () => setTimeout(play, 150));
if (document.readyState === "complete") setTimeout(play, 150);
</script>
<script>
(function(){
const PAL=['#2f6fb5','#c9a45c','#2fa39b','#7a6bc4','#58a468','#6fa8dc','#b89a4e','#3d4fa8'];
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',K=Math.cos(14*Math.PI/180);
let UF=[],cur=null,munCache={},munData=[];
const svg=$('gSvg'),tip=$('gTip'),map=$('gMap'),list=$('gList'),q=$('gQ'),card=$('gCard');
const px=(a,d)=>a/d*K, py=(a,d)=>-a/d;
function d(rings,dv){return rings.map(r=>'M'+r.map(p=>px(p[0],dv).toFixed(3)+' '+py(p[1],dv).toFixed(3)).join('L')+'Z').join('')}
function mk(dd,fill,cls){const p=document.createElementNS(NS,'path');p.setAttribute('d',dd);p.setAttribute('fill',fill);if(cls)p.setAttribute('class',cls);svg.appendChild(p);return p}
function bbox(rs,dv){let a=1e9,b=1e9,c=-1e9,e=-1e9;rs.forEach(r=>r.forEach(p=>{const x=px(p[0],dv),y=py(p[1],dv);a=Math.min(a,x);c=Math.max(c,x);b=Math.min(b,y);e=Math.max(e,y)}));return[a,b,c,e]}
function view(bb,pad){const w=bb[2]-bb[0],h=bb[3]-bb[1],p=Math.max(w,h)*pad;svg.setAttribute('viewBox',[bb[0]-p,bb[1]-p,w+2*p,h+2*p].join(' '))}
function showTip(e,h){const r=map.getBoundingClientRect();tip.innerHTML=h;tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.style.opacity=1}
const hide=()=>tip.style.opacity=0;
function stats(a){$('gStats').innerHTML=a.map(x=>'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')}
function fmt(n){return n.toLocaleString('pt-BR')}
function drawBR(){
  cur=null;munData=[];svg.innerHTML='';map.classList.remove('zm');card.hidden=true;
  $('gTitle').textContent='Brasil';$('gSub').textContent='Clique em um estado para abrir seus municípios.';$('gSideT').textContent='Estados';q.placeholder='Buscar estado…';q.value='';
  const all=[];UF.forEach(u=>{const p=mk(d(u.p,100),PAL[u.col],'uf');p.dataset.s=u.sigla;all.push.apply(all,u.p);
    p.addEventListener('mousemove',e=>showTip(e,'<b>'+u.nome+'</b><small>'+u.sigla+' · '+u.reg+' · '+fmt(Math.round(u.area))+' km²</small>'));p.addEventListener('mouseleave',hide);p.addEventListener('click',()=>openUF(u.sigla))});
  view(bbox(all,100),.02);stats([[27,'Estados'],[5570,'Municípios'],[5,'Regiões']]);renderList()}
function renderList(){const t=q.value.trim().toLowerCase();
  if(!cur){list.innerHTML='';UF.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).filter(u=>!t||u.nome.toLowerCase().includes(t)||u.sigla.toLowerCase()===t).forEach(u=>{const b=document.createElement('button');b.className='g-it';b.innerHTML='<i style="background:'+PAL[u.col]+'"></i>'+u.nome+'<em>'+u.sigla+'</em>';b.onclick=()=>openUF(u.sigla);list.appendChild(b)})}
  else{list.innerHTML='';if(!t){list.innerHTML='<p class="g-note">Digite o nome de um município para encontrá-lo.</p>';return}
    munData.filter(m=>m.n.toLowerCase().includes(t)).slice(0,30).forEach(m=>{const b=document.createElement('button');b.className='g-it';b.innerHTML=m.n+'<em>'+(m.rgi||'')+'</em>';b.onclick=()=>pick(m);list.appendChild(b)})}}
function pick(m){svg.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));if(m.el){m.el.classList.add('sel');m.el.parentNode.appendChild(m.el)}
  card.hidden=false;card.innerHTML='<b>'+m.n+'</b><br>'+cur.nome+' · '+cur.sigla+'<br>Área: '+fmt(Math.round(m.a))+' km²'+(m.rgi?'<br>Região geográfica imediata: '+m.rgi:'')+'<br>Código IBGE: '+m.id+
    (cur.sigla==='SC'?'<br><a href="../beta/">Abrir ADHONEP-SC →</a>':'')}
async function openUF(s){
  const u=UF.find(x=>x.sigla===s);cur=u;hide();svg.innerHTML='';map.classList.add('zm');card.hidden=true;q.value='';
  $('gTitle').textContent=u.nome;$('gSub').textContent='Carregando municípios…';$('gSideT').textContent='Municípios';q.placeholder='Buscar município…';
  view(bbox(u.p,100),.04);mk(d(u.p,100),PAL[u.col],'dim').style.opacity=.5;
  try{munData=munCache[s]||(munCache[s]=await (await fetch('data/mun/'+s+'.json')).json())}catch(e){$('gSub').textContent='Não foi possível carregar os municípios (abra via servidor local/HTTP).';return}
  if(cur!==u)return;svg.innerHTML='';const base=PAL[u.col],all=[];
  munData.forEach((m,i)=>{const p=mk(d(m.p,1000),base,'mu');p.style.opacity=.78+((i*37)%5)*.055;m.el=p;all.push.apply(all,m.p);
    p.addEventListener('mousemove',e=>showTip(e,'<b>'+m.n+'</b><small>'+fmt(Math.round(m.a))+' km²</small>'));p.addEventListener('mouseleave',hide);p.addEventListener('click',()=>pick(m))});
  view(bbox(all,1000),.03);$('gSub').textContent=munData.length+' municípios · passe o mouse ou busque pelo nome.';
  stats([[munData.length,'Municípios'],[fmt(Math.round(u.area)),'km²'],[u.reg,'Região']]);renderList()}
q.addEventListener('input',renderList);$('gBack').onclick=()=>{drawBR()};
$('gTheme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('adh-tema',n)}catch(e){}};
$('gIntro').onclick=()=>{document.documentElement.classList.remove('app-on');$('stage').classList.remove('gone');window.__play&&window.__play()};
$('enter').onclick=()=>{document.documentElement.classList.add('app-on');$('stage').classList.add('gone');scrollTo(0,0)};
fetch('data/uf.json').then(r=>r.json()).then(j=>{UF=j;drawBR()}).catch(()=>{$('gSub').textContent='Abra por um servidor HTTP local (ex.: python3 -m http.server).'});
})();

</script>

</body></html>
