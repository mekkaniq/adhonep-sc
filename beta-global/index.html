<style>
/* Layout: uma cena em tela cheia — abertura de palavras ("Bem-vindo" em vários idiomas) que sobe numa curva e revela a marca sobre a Terra. Visual único, escuro por escolha. */
:root{
  --night:#050c18; --navy:#0b1b33; --navy-2:#14305a;
  --gold:#c9a45c; --gold-soft:#e6cf9c; --ink:#eef2f8; --mute:#94a6bf;
  --display:"Cormorant Garamond","Noto Serif","Noto Sans Arabic","Noto Sans Ethiopic","Noto Sans Armenian",Georgia,serif;
  --clean:"Inter Tight","Inter",system-ui,-apple-system,"SF Pro Display","Segoe UI","Noto Sans Arabic","Noto Sans Ethiopic","Noto Sans Armenian",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Noto Sans Ethiopic","Noto Sans Armenian",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}

/* ---------- cena final: a marca sobre a Terra ---------- */
.scene{position:absolute;inset:0;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.sky{position:absolute;inset:-4%;background:var(--night) url("assets/g/sky.jpg") center 55%/cover no-repeat;transform:scale(1.14);transition:transform 5.5s cubic-bezier(.2,.7,.2,1),filter 2s ease;filter:brightness(.55) saturate(1.05)}
.shade{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 45%,rgba(5,12,24,.15),rgba(5,12,24,.8))}
.revealed .sky{transform:scale(1.02);filter:brightness(.72) saturate(1.05)}
.brandwrap{position:relative;display:grid;justify-items:center;gap:clamp(18px,3vh,30px);text-align:center;max-width:100%}
.brand{display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.sym{height:clamp(120px,22vh,230px);width:auto;opacity:0;transform:scale(.86);transition:opacity 1s ease,transform 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 26px rgba(230,207,156,.35))}
.word{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(6px,1.1vh,12px);width:max-content}
.word img{height:clamp(34px,6.4vh,66px);width:auto;max-width:none;display:block}
.bn{display:block;font:600 16px/1 var(--body);letter-spacing:.34em;color:#c9a868;white-space:nowrap;margin-right:-.34em}
.wordbox{overflow:hidden;max-width:0;transition:max-width 1.3s cubic-bezier(.65,0,.25,1),margin 1.3s cubic-bezier(.65,0,.25,1)}
.wordbox .word{clip-path:inset(0 100% 0 0);transition:clip-path 1.3s cubic-bezier(.65,0,.25,1) .1s}
.s1 .sym{opacity:1;transform:scale(1)}
.s2 .wordbox{margin-left:clamp(14px,2.2vw,30px)}
.s2 .wordbox .word{clip-path:inset(0 0 0 0)}
.tag{font:500 clamp(22px,3.4vw,40px)/1.15 var(--display);color:var(--ink);letter-spacing:.01em;text-wrap:balance;opacity:0;transform:translateY(12px);transition:opacity .9s ease,transform .9s ease;min-height:1.2em}
.tag.swap{opacity:0!important;transform:translateY(6px)!important;transition-duration:.25s}
.rule{width:min(420px,60vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity 1s ease .2s}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;opacity:0;transform:translateY(10px);transition:opacity .9s ease .25s,transform .9s ease .25s}
.lang{font:600 13px/1 var(--body);letter-spacing:.06em;color:var(--ink);background:rgba(11,27,51,.55);border:1px solid rgba(201,164,92,.45);border-radius:999px;padding:10px 16px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s,color .2s,border-color .2s}
.lang:hover{border-color:var(--gold-soft)}
.lang[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--navy);border-color:transparent}
.lang:focus-visible,.replay:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.s3 .tag{opacity:1;transform:none}
.s3 .rule{opacity:.9}
.foot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:11.5px;color:var(--mute);opacity:0;transition:opacity 1s ease .6s}
.s3 .foot{opacity:1}
.replay{font:600 12px var(--body);color:var(--gold-soft);background:transparent;border:1px solid rgba(201,164,92,.4);border-radius:999px;padding:8px 14px;cursor:pointer}
.replay:hover{background:rgba(201,164,92,.12)}

/* ---------- abertura: "Bem-vindo" subindo em vários idiomas ---------- */
.intro{position:absolute;inset:0;z-index:5;will-change:transform}
.intro-bg{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 45%,#0d1e38,#060d1a 60%,#03070f)}
.curve{position:absolute;left:0;top:calc(100% - 1px);width:100%;height:24vh;display:block}
.curve path{fill:var(--night)}
.words{position:absolute;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{grid-area:1/1;display:grid;justify-items:center;gap:16px;text-align:center;opacity:0;transform:translateY(42%);filter:blur(10px);transition:opacity .38s ease,transform .5s cubic-bezier(.2,.8,.2,1),filter .45s ease;max-width:100%}
.w.on{opacity:1;transform:none;filter:none}
.w.off{opacity:0;transform:translateY(-46%);filter:blur(8px)}
.w b{display:block;font:400 clamp(42px,8.6vw,118px)/1.06 var(--clean);color:#fff;letter-spacing:-.035em;overflow-wrap:anywhere}
.w small{font:500 11px/1 var(--body);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.42)}
.w.fast{filter:none!important}
.w.fast:not(.on){transform:translateY(22%)}
.w.fast.off{transform:translateY(-24%)}
.count{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font:500 11px/1 var(--body);letter-spacing:.3em;color:var(--mute);text-transform:uppercase}
.count i{font-style:normal;color:var(--gold-soft);font-variant-numeric:tabular-nums}
.done .intro{pointer-events:none}

@media (max-width:640px){
  .brand{flex-direction:column}
  .s2 .wordbox{margin-left:0;margin-top:14px}
  .wordbox{max-width:none;max-height:0;transition:max-height 1.3s cubic-bezier(.65,0,.25,1),margin 1.3s cubic-bezier(.65,0,.25,1)}
  .word{align-items:center}
  .word img{height:auto;width:min(74vw,400px)}
  .foot{flex-direction:column;justify-content:center;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  .w,.sym,.wordbox,.wordbox .word,.tag,.langs,.rule,.foot,.sky{transition:none!important}
}
/* ===== app (mapa Brasil → estado → municípios) ===== */
:root{--g-bg:#f3f6fa;--g-card:#fff;--g-ink:#19283a;--g-mute:#5d6e82;--g-line:#dfe6ee;--g-navy:#102b4e;--g-gold:#c9a45c;--g-sea:#e8eef6}
html[data-theme=dark]{--g-bg:#07101f;--g-card:#0e1c33;--g-ink:#e7eef8;--g-mute:#9fb2c8;--g-line:#1d3150;--g-sea:#0a1629;color-scheme:dark}
html.app-on,html.app-on body{height:auto;overflow:auto}
body{background:var(--g-bg)}
#app{display:none;min-height:100vh;color:var(--g-ink);font-family:var(--body)}
html.app-on #app{display:block}
.g-top{display:flex;align-items:center;gap:14px;padding:12px max(16px,3vw);background:#0b1b33;border-bottom:2px solid var(--g-gold);position:sticky;top:0;z-index:20}
.g-top img{height:34px}.g-top b{color:#fff;font:600 14px var(--body);letter-spacing:.2em}.g-top b i{font-style:normal;color:var(--g-gold)}
.g-top .sp{flex:1}.g-btn{font:600 13px var(--body);color:#e6cf9c;background:transparent;border:1px solid rgba(201,164,92,.5);border-radius:999px;padding:8px 14px;cursor:pointer}
.g-btn:hover{background:rgba(201,164,92,.14)}
.g-wrap{max-width:1280px;margin:0 auto;padding:22px max(16px,3vw) 60px}
.g-h{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:16px}
.g-h h1{font:600 clamp(26px,3.4vw,40px)/1.1 var(--display);margin:0;color:var(--g-ink)}.g-h p{margin:4px 0 0;color:var(--g-mute);font-size:14px}
.g-st{display:flex;gap:10px;flex-wrap:wrap}.g-st div{background:var(--g-card);border:1px solid var(--g-line);border-top:3px solid var(--g-gold);border-radius:10px;padding:8px 16px;text-align:center}
.g-st b{display:block;font:700 22px var(--clean);color:var(--g-ink)}.g-st span{font-size:11px;color:var(--g-mute);letter-spacing:.05em;text-transform:uppercase}
.g-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
@media(max-width:900px){.g-grid{grid-template-columns:1fr}}
.g-map{position:relative;background:var(--g-sea);border:1px solid var(--g-line);border-radius:16px;overflow:hidden;min-height:340px}
.g-map svg{display:block;width:100%;height:min(74vh,720px)}
.g-map path{stroke:var(--g-bg);stroke-width:.35;vector-effect:non-scaling-stroke;stroke-width:1;cursor:pointer;transition:filter .15s,opacity .2s}
html[data-theme=dark] .g-map path{stroke:#07101f}
.g-map path:hover{filter:brightness(1.18) saturate(1.1)}
.g-map.zm path.dim{opacity:.35}.g-map path.hc{stroke:#fff;stroke-width:1.4}
#gGlobe{display:none;width:100%;height:min(74vh,720px);cursor:grab;touch-action:none}#gGlobe:active{cursor:grabbing}
.g-map.gl{background:radial-gradient(80% 90% at 50% 45%,#0d1e38,#060d1a 62%,#03070f);border-color:#1d3150}.g-map.gl #gGlobe{display:block}.g-map.gl svg{display:none}
.g-hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:#9fb2c8;pointer-events:none;display:none}.g-map.gl .g-hint{display:block}.g-map path.ct{stroke:var(--g-bg);fill:#6b7f99}.g-map path.ct.off{fill:#9db0c8;opacity:.45}.g-map path.ct.on{fill:#2f6fb5}.g-map path.ct.br{fill:#c9a45c}html[data-theme=dark] .g-map path.ct.off{fill:#2a3f5f;opacity:.9}
.g-map path.sel{stroke:var(--g-gold);stroke-width:2.2;filter:brightness(1.15)}
.g-tip{position:absolute;pointer-events:none;background:#0b1b33;color:#fff;border:1px solid var(--g-gold);border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.35;opacity:0;transform:translate(-50%,-120%);transition:opacity .12s;white-space:nowrap;z-index:5}
.g-tip small{color:#e6cf9c;display:block}
.g-back{position:absolute;left:12px;top:12px;z-index:6;display:none}
.g-map.zm .g-back,.g-map.gl.zc .g-back{display:block}.g-back.g-btn{background:#0b1b33}
.g-side{background:var(--g-card);border:1px solid var(--g-line);border-radius:16px;padding:14px;max-height:min(74vh,720px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.g-side h3{margin:0;font:600 18px var(--display);color:var(--g-ink)}
.g-side input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--g-line);background:var(--g-bg);color:var(--g-ink);font:14px var(--body)}
.g-side input:focus{outline:2px solid var(--g-gold)}
.g-list{display:flex;flex-direction:column;gap:3px;overflow:auto}
.g-it{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--g-ink);border:0;background:transparent;text-align:left;font-family:inherit}
.g-it:hover,.g-it.on{background:rgba(201,164,92,.16)}.g-it i{width:12px;height:12px;border-radius:3px;flex:none}.g-it em{margin-left:auto;font-style:normal;color:var(--g-mute);font-size:12px}
.g-card{border:1px solid var(--g-line);border-left:3px solid var(--g-gold);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;background:var(--g-bg)}
.g-card b{font-size:15px}.g-card a{color:var(--g-gold)}
.g-note{font-size:12px;color:var(--g-mute)}
.enter{margin-top:6px;font:600 14px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--navy);background:linear-gradient(135deg,var(--gold-soft),var(--gold));border:0;border-radius:999px;padding:14px 30px;cursor:pointer;opacity:0;transform:translateY(10px);transition:opacity .9s ease .45s,transform .9s ease .45s,filter .2s;pointer-events:none}
.s3 .enter{opacity:1;transform:none;pointer-events:auto}.enter:hover{filter:brightness(1.08)}
.flags{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(12px,2.4vw,26px);opacity:0;transform:translateY(10px);transition:opacity .9s ease .45s,transform .9s ease .45s;pointer-events:none}
.s3 .flags{opacity:1;transform:none;pointer-events:auto}
.fl{display:grid;justify-items:center;gap:9px;background:none;border:0;cursor:pointer;color:var(--ink);font:500 13px var(--body);letter-spacing:.04em;padding:6px;border-radius:12px}
.fl svg{width:72px;height:50px;border-radius:7px;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.45);transition:transform .25s,box-shadow .25s}
.fl:hover svg,.fl:focus-visible svg{transform:translateY(-4px) scale(1.06);box-shadow:0 0 0 2px var(--gold),0 12px 28px rgba(0,0,0,.55)}
.fl:focus-visible{outline:none}.fl span{opacity:.85}
.g-map path.ct{}
.g-ch{display:flex;flex-wrap:wrap;gap:6px}.g-ch button{font:600 12px var(--body);border:1px solid var(--g-line);background:var(--g-bg);color:var(--g-ink);border-radius:999px;padding:6px 11px;cursor:pointer}.g-ch button.on{background:linear-gradient(135deg,#e6cf9c,#c9a45c);color:#0b1b33;border-color:transparent}.g-ch button:hover{border-color:var(--g-gold)}
.g-clock{margin:6px 0 0;font:600 14px var(--clean);color:var(--g-gold);letter-spacing:.02em}.g-clock small{color:var(--g-mute);font-weight:500}
.g-ac{display:flex;flex-wrap:wrap;gap:6px}.g-ac button{font:600 12px var(--body);border:1px solid var(--g-gold);background:transparent;color:var(--g-ink);border-radius:999px;padding:6px 11px;cursor:pointer}.g-ac button:hover{background:rgba(201,164,92,.18)}
.g-tour{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:7;display:flex;align-items:center;gap:8px;background:rgba(11,27,51,.88);border:1px solid var(--g-gold);border-radius:999px;padding:6px 12px;color:#fff;font:600 13px var(--body);backdrop-filter:blur(6px)}
.g-tour[hidden]{display:none}.g-tour button{background:none;border:0;color:#e6cf9c;font-size:17px;cursor:pointer;padding:4px 6px}.g-tour span{padding:0 6px;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-hr{border:0;border-top:1px solid var(--g-line);margin:10px 0}.g-ul{margin:4px 0 8px;padding-left:18px}.g-q{margin:6px 0 8px;padding:6px 10px;border-left:2px solid var(--g-gold);background:rgba(201,164,92,.08);border-radius:0 8px 8px 0}.g-share{margin-top:8px;font:600 12px var(--body);border:1px solid var(--g-gold);background:transparent;color:var(--g-ink);border-radius:999px;padding:6px 12px;cursor:pointer}.g-card a{color:var(--g-gold)}
.stage.gone{opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
html.app-on .stage{pointer-events:none}
</style>

<body>

  <section class="scene" aria-label="ADHONEP Global">
    <div class="sky" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>

        <div class="wordbox" id="wordbox"><div class="word" id="word" role="img" aria-label="ADHONEP Businessman Network"><img src="assets/g/wordtop.png" alt="" width="900" height="133"><span class="bn" id="bn">BUSINESSMAN NETWORK</span></div></div>

<main id="app" aria-label="Plataforma ADHONEP Global">

<script>
/* Abertura própria (inspirada no conceito de "preloader de palavras"; código original).
   Saudação de boas-vindas em idiomas da lista de países da ADHONEP / FGBMFI. */
const WORDS = [
  ["Bem-vindo","Português","pt"],["Bienvenido","Español","es"],["Welcome","English","en"],["Bienvenue","Français","fr"],
  ["Willkommen","Deutsch","de"],["Benvenuto","Italiano","it"],["Welkom","Nederlands","nl"],["Välkommen","Svenska","sv"],
  ["Tervetuloa","Suomi","fi"],["Vítejte","Čeština","cs"],["Üdvözöljük","Magyar","hu"],["Добро пожаловать","Русский","ru"],
  ["Ласкаво просимо","Українська","uk"],["Բարի գալուստ","Հայերեն","hy"],["Selamat datang","Bahasa Melayu","ms"],
  ["أهلاً وسهلاً","العربية","ar"],["እንኳን ደህና መጡ","አማርኛ","am"],["Karibu","Kiswahili","sw"],["Wamukelekile","isiZulu","zu"],
  ["Wamkelekile","isiXhosa","xh"],["Murakaza neza","Kinyarwanda","rw"],["Tongasoa","Malagasy","mg"],["Takulandirani","Chichewa","ny"],
  ["Boyei malamu","Lingála","ln"],["Dalal ak jàmm","Wolof","wo"],["Kaze neza","Ikirundi","rn"],["Eguahẽporãite","Avañe'ẽ","gn"],
  ["Bainvegni","Rumantsch","rm"],["Bem-vindo","Português","pt"]
];
const TAGS = {
  pt:"Uma comunhão que fala muitas línguas.",
  es:"Una comunión que habla muchos idiomas.",
  en:"One fellowship, many languages.",
  fr:"Une communion qui parle de nombreuses langues."
};
const $ = id => document.getElementById(id);
const stage = $("stage"), intro = $("intro"), words = $("words"), path = $("curvePath");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const total = WORDS.length - 1; // a última repete o português
let timers = [], raf = 0;

/* ritmo: começa devagar e acelera, como quem passa por todo o mapa */
function durations(n){
  const d = [];
  for (let i = 0; i < n; i++){
    if (i === 0) d.push(900);
    else if (i === n - 1) d.push(1100);
    else d.push(Math.max(105, Math.round(560 * Math.pow(0.86, i - 1))));
  }
  return d;
}

function resetScene(){

function fitBN(){
  const img = document.querySelector("#word img"), bn = $("bn"); if (!img || !bn) return;
  const w = img.getBoundingClientRect().width; if (!w) return;
  bn.style.fontSize = "16px"; const k = w / (bn.getBoundingClientRect().width || w);

addEventListener("resize", fitBN);
function revealBrand(){
  fitBN();

  later(() => {
    const wb = $("wordbox"), img = $("word");
    if (matchMedia("(max-width:640px)").matches) wb.style.maxHeight = (img.getBoundingClientRect().height || 200) + 40 + "px";
    else wb.style.maxWidth = (img.getBoundingClientRect().width || 600) + 4 + "px";
    setStage("s2");
  }, 1150);
  later(() => setStage("s3"), 2300);
}

/* saída: a tela sobe e a borda de baixo faz uma curva que se endireita */
function lift(){
  const H = innerHeight, t0 = performance.now(), D = 1150;
  const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
  later(revealBrand, 380);
  (function step(now){
    const k = Math.min(1, (now - t0) / D), e = ease(k);
    intro.style.transform = `translateY(${-e * (H * 1.3)}px)`;
    const bulge = 100 * Math.sin(Math.min(1, k * 1.1) * Math.PI) * (1 - k * .35);
    path.setAttribute("d", `M0 0 L1000 0 Q500 ${bulge.toFixed(1)} 0 0 Z`);
    if (k < 1) raf = requestAnimationFrame(step);
    else { intro.style.display = "none"; setStage("done"); }
  })(t0);
}

function play(){
  clearAll(); resetScene();
  if (reduce){ fitBN(); intro.style.display = "none"; stage.classList.add("revealed","s1","s2","s3","done"); const wb=$("wordbox"); wb.style.maxWidth="none"; wb.style.maxHeight="none"; return; }
  const ds = durations(els.length); let t = 250;
  els.forEach((el, i) => {
    const dur = ds[i] / 1000, fast = ds[i] < 240;
    el.style.transition = `opacity ${Math.min(.38, dur * .7).toFixed(2)}s ease, transform ${Math.min(.5, dur * .9).toFixed(2)}s cubic-bezier(.2,.8,.2,1), filter ${Math.min(.45, dur * .7).toFixed(2)}s ease`;
    if (fast) el.classList.add("fast");
    later(() => {
      if (i > 0) els[i-1].className = "w off" + (ds[i] < 240 ? " fast" : "");
      el.className = "w on" + (fast ? " fast" : "");
    }, t);
    t += ds[i];
  });
  later(lift, t);
}

$("replay").addEventListener("click", play); window.__play = play;
window.addEventListener("load", () => setTimeout(play, 150));
if (document.readyState === "complete") setTimeout(play, 150);

function infoHtml(id){const p=(CT.paises||{})[id];if(!p&&!(CT.historias||[]).length)return '';const today=new Date().toISOString().slice(0,10);
  const evs=(CT.agenda||[]).filter(e=>e.pais===id&&e.data>=today).concat((p&&p.eventos||[]).filter(e=>e.data>=today)).sort((a,b)=>a.data.localeCompare(b.data));
  const ts=((p&&p.testemunhos)||[]).filter(x=>x.autorizado===true);
  const st=(CT.historias||[]).filter(h=>h.autorizado===true&&(h.paises||[]).includes(id));
  let h='<hr class="g-hr">';
  if(p&&p.inst)h+='<b>'+T('inst')+'</b><br><span class="g-note">'+esc(p.inst)+'</span><br>';
  if(p&&p.links&&p.links.length)h+='<b>'+T('offl')+'</b><br>'+p.links.filter(l=>okU(l.u)).map(l=>'<a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.t)+' ↗</a>').join('<br>')+'<br>';
  h+='<b>'+T('evs')+'</b><br>'+(evs.length?'<ul class="g-ul">'+evs.map(evLi).join('')+'</ul>':'<span class="g-note">'+T('noEv')+'</span><br>');
  h+='<b>'+T('tests')+'</b><br>'+(ts.length?ts.map(x=>'<blockquote class="g-q">“'+esc(x.texto)+'”<br><span class="g-note">— '+esc(x.nome)+(x.cidade?', '+esc(x.cidade):'')+'</span></blockquote>').join(''):'<span class="g-note">'+T('noT')+'</span><br>');
  if(st.length)h+='<b>'+T('stor')+'</b>'+st.map(s=>'<blockquote class="g-q"><b>'+esc(s.titulo)+'</b><br>'+esc(s.texto)+'<br>'+(s.paises||[]).filter(x=>x!==id).map(x=>{const c=W.find(w=>w.id===x);return c?'<a href="?pais='+x+'" data-go="'+x+'">'+T('with')+' '+esc(cname(c))+'</a>':''}).join(' · ')+(s.fonte?'<br><span class="g-note">'+esc(s.fonte)+'</span>':'')+'</blockquote>').join('');
  h+='<button class="g-share" data-share="1">'+T('share')+'</button>';return h}
function setUrl(o){try{const u=new URL(location.href);['pais','uf'].forEach(k=>u.searchParams.delete(k));Object.keys(o||{}).forEach(k=>u.searchParams.set(k,o[k]));history.replaceState(null,'',u)}catch(e){}}
card.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();const c=W.find(w=>w.id===a.dataset.go);c&&pickCountry(c,true)}
  if(e.target.closest('[data-share]')){const b=e.target.closest('[data-share]');(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>{b.textContent=T('copied')},()=>{b.textContent=location.href})}});
function agendaView(){lvl='world';hide();const today=new Date().toISOString().slice(0,10),L=(CT.agenda||[]).filter(e=>e.data>=today).sort((a,b)=>a.data.localeCompare(b.data));
  head(T('world'),T('agendaT'),T('agenda').replace('📅 ',''),T('searchC'));list.innerHTML=L.length?'':'<p class="g-note">'+T('noEv')+'</p>';
  L.forEach(e=>{const c=W.find(w=>w.id===e.pais),b=document.createElement('button');b.className='g-it';b.innerHTML=fdate(e.data)+' · '+esc(e.titulo)+'<em>'+esc(e.cidade||'')+'</em>';b.onclick=()=>c&&pickCountry(c,true);list.appendChild(b)})}
const Q0=location.search;
function deepLink(){const q=new URLSearchParams(Q0),l=q.get('lang');if(l&&TR[l]&&l!==LANG)setLang(l);const id=(q.get('pais')||'').toUpperCase(),c=W.find(w=>w.id===id);if(!c)return;
  document.documentElement.classList.add('app-on');$('stage').classList.add('gone');
  if(id==='BRA'){BRON=false;drawBR();const uf=(q.get('uf')||'').toUpperCase();if(uf&&UF.find(u=>u.sigla===uf))openUF(uf)}else pickCountry(c,false)}
function drawWorld(){
  setUrl();clockOff();tourOff();const was=lvl;lvl='world';cur=ctry=null;munData=[];svg.innerHTML='';crumbs();map.classList.remove('zm');globeOn();
  head(T('world'),T('worldSub'),T('countries'),T('searchC'));
  if(CONT){const f=CF[CONT];fly(f[0],f[1],f[2])}else if(was!=='world')fly(G.lon,Math.min(G.lat,30),1);chips();acBtns();G.idle=performance.now()+1500;
  stats([[W.length,T('nC')],[ADH.size,T('nA')],[4,T('nL')]]);renderList()}
function pickCountry(c,tour){hide();const ci=cInfo(c);clockOn(c.id);
  if(c.id==='BRA'&&!tour){lvl='country';ctry=c;crumbs();map.classList.remove('zm');fly(-52,-14,2.3,()=>{globeOff();BRON=false;drawBR()});return}
  lvl='country';ctry=c;crumbs();map.classList.remove('zm');globeOn();const on=PI[c.id];
  head(cname(c),ADH.has(c.id)?(c.id==='BRA'?T('docum'):T('informed')):T('none'),T('country'),T('searchC'));
  fly(ci.lon,ci.lat,ci.k,tour?tourArrive:null,!!tour);stats([[ADH.has(c.id)?(c.id==='BRA'?Object.values(CAP).reduce((a,v)=>a+v.length,0)+'+':T('confirm')):'—',ADH.has(c.id)&&c.id==='BRA'?T('chap'):T('presence')],[on?on.split(/[;,]| e /)[0]:'—',T('mainLang')]]);
  list.innerHTML='<p class="g-note">'+T('nextLvl')+'</p>';
  card.hidden=false;card.innerHTML='<b>'+cname(c)+'</b><br>'+(ADH.has(c.id)?(c.id==='BRA'?T('docum'):T('informed'))+'<br>':'')+(on?T('langs')+': '+on+'<br>':'')+'<span class="g-note">'+(ADH.has(c.id)?T('pres2')+' ':'')+T('noLvl')+'</span>'+infoHtml(c.id);setUrl({pais:c.id})}
const tc=s=>s.toLowerCase().replace(/(^|[\s–|(-])(\p{L})/gu,(m,a,z)=>a+z.toUpperCase()).replace(/ (De|Do|Da|Dos|Das|E) /g,x=>x.toLowerCase());
function drawBR(){
  if(BRON&&RM){return drawBRR()}
  setUrl({pais:'BRA'});globeOff();tourOff();clockOn('BRA');lvl='br';cur=ctry=null;munData=[];svg.innerHTML='';crumbs();
  head(cname(W.find(x=>x.id==='BRA')||{c:'BR',n:'Brasil'}),T('brSub'),T('states'),T('searchS'));
  const all=[];UF.forEach(u=>{const p=mk(dB(u.p,100),PAL[u.col],'uf');p.dataset.s=u.sigla;all.push.apply(all,u.p);
    p.addEventListener('mousemove',e=>showTip(e,'<b>'+u.nome+'</b><small>'+u.sigla+' · '+u.reg+(CAP[u.sigla]?' · '+CAP[u.sigla].length+' '+T('chap').toLowerCase():'')+'</small>'));p.addEventListener('mouseleave',hide);p.addEventListener('click',()=>openUF(u.sigla))});
  card.hidden=false;card.innerHTML='<b>'+T('inst')+'</b>'+infoHtml('BRA');view(bboxB(all,100),.02);stats([[27,T('states')],[fmt(5570),T('muni')],[5,T('regions')]]);renderList();brBtn()}

const regCol=i=>'hsl('+((i*137.5)%360).toFixed(0)+',48%,'+(i%2?50:58)+'%)';
const gcol=(u,k)=>{let n=0;for(const x of UF){if(x.sigla===u)break;n+=RG[x.sigla]?RG[x.sigla].r.length:0}return regCol(n+k)};
function brBtn(){const el=$('gRg');if(lvl!=='br'||!RG){return}el.style.display='flex';el.innerHTML='';const b=document.createElement('button');b.textContent=T('rgBtn');b.className=BRON?'on':'';b.onclick=async()=>{BRON=!BRON;if(BRON&&!RM){try{RM=await (await fetch('data/regioes_mapa.json')).json()}catch(e){BRON=false;return}}drawBR()};el.appendChild(b)}
function drawBRR(){
  setUrl({pais:'BRA'});globeOff();tourOff();clockOn('BRA');lvl='br';cur=ctry=null;munData=[];svg.innerHTML='';crumbs();
  head(cname(W.find(x=>x.id==='BRA')||{c:'BR',n:'Brasil'}),T('brHyp'),T('brRg'),T('searchS'));
  const all=[];RM.forEach(r=>{const p=mk(dB(r.p,100),gcol(r.u,r.k),'uf');p.dataset.s=r.u;all.push.apply(all,r.p);const nm=RG[r.u].r[r.k];
    p.addEventListener('mousemove',e=>showTip(e,'<b>'+esc(nm)+'</b><small>'+r.u+' · '+r.c+' '+T('muni').toLowerCase()+(r.u==='SC'?' · ADHONEP-SC':'')+'</small>'));p.addEventListener('mouseleave',hide);p.addEventListener('click',()=>openUF(r.u))});
  card.hidden=true;view(bboxB(all,100),.02);stats([[27,T('states')],[RM.length,T('rgIn')+'s']]);brList();brBtn()}
function brList(){const t=q.value.trim().toLowerCase();list.innerHTML='';
  UF.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).filter(u=>RG[u.sigla]&&(!t||u.nome.toLowerCase().includes(t)||u.sigla.toLowerCase()===t)).forEach(u=>{const b=document.createElement('button');b.className='g-it';b.innerHTML='<i style="background:'+gcol(u.sigla,0)+'"></i>'+u.nome+'<em>'+RG[u.sigla].r.length+(u.sigla==='SC'?' ✓':'')+'</em>';b.onclick=()=>openUF(u.sigla);list.appendChild(b)})}
function regBtn(){const el=$('gRg');el.style.display=(lvl==='uf'&&RG&&RG[cur.sigla])?'flex':'none';el.innerHTML='';if(el.style.display==='none')return;const b=document.createElement('button');b.textContent=T('rgBtn');b.className=REGON?'on':'';b.onclick=()=>{REGON=!REGON;RSEL=-1;applyReg();regBtn();renderList()};el.appendChild(b);const a=document.createElement('a');a.textContent=T('mgmt')+' ↗';a.href='../beta/'+(cur.sigla==='SC'?'':'?uf='+cur.sigla);a.target='_blank';a.rel='noopener';a.className='mg-link';a.style.cssText='margin-left:8px;font-size:12px;color:var(--gold,#c9a45c);text-decoration:underline;align-self:center';el.appendChild(a)}
function applyReg(){if(lvl!=='uf'||!cur)return;const D=RG&&RG[cur.sigla];regBtn();if(!D)return;
  munData.forEach(m=>{if(!m.el)return;const i=D.m[m.id];if(REGON&&i!==undefined){m.el.setAttribute('fill',regCol(i));m.el.style.opacity=RSEL<0||RSEL===i?.95:.2;m.el.style.stroke=m.cap?'#c9a45c':'';m.el.style.strokeWidth=m.cap?'2':''}else{m.el.setAttribute('fill',m.f0);m.el.style.opacity=m.o0;m.el.style.stroke='';m.el.style.strokeWidth=''}});
  if(REGON)$('gSub').textContent=cur.sigla==='SC'?T('rgSC'):T('rgHyp')}
function regList(){const D=RG[cur.sigla],c=D.r.map(()=>0);Object.values(D.m).forEach(i=>c[i]++);list.innerHTML='';
  D.r.map((n,i)=>[n,i,c[i]]).sort((a,b)=>a[0].localeCompare(b[0],'pt-BR')).forEach(x=>{const b=document.createElement('button');b.className='g-it'+(RSEL===x[1]?' on':'');b.innerHTML='<i style="background:'+regCol(x[1])+'"></i>'+esc(x[0])+'<em>'+x[2]+'</em>';b.onclick=()=>{RSEL=RSEL===x[1]?-1:x[1];applyReg();regList()};list.appendChild(b)})}
function renderList(){const t=q.value.trim().toLowerCase();list.innerHTML='';
  if(lvl==='world'){W.slice().sort((a,b)=>(ADH.has(b.id)-ADH.has(a.id))||cname(a).localeCompare(cname(b),LANG)).filter(c=>(!CONT||contOf(c)===CONT)&&(!t||cname(c).toLowerCase().includes(t))).slice(0,t?40:200).forEach(c=>{const b=document.createElement('button');b.className='g-it';b.innerHTML='<i style="background:'+(ADH.has(c.id)?'#c9a45c':'#6b7f99')+'"></i>'+cname(c)+'<em>'+(c.id==='BRA'?'●':'')+'</em>';b.onclick=()=>pickCountry(c);list.appendChild(b)})}
  else if(lvl==='br'&&BRON&&RM){brList();return}
  else if(lvl==='br'){UF.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).filter(u=>!t||u.nome.toLowerCase().includes(t)||u.sigla.toLowerCase()===t).forEach(u=>{const b=document.createElement('button');b.className='g-it';b.innerHTML='<i style="background:'+PAL[u.col]+'"></i>'+u.nome+'<em>'+u.sigla+'</em>';b.onclick=()=>openUF(u.sigla);list.appendChild(b)})}
  else if(lvl==='uf'){if(!t&&REGON&&RG&&RG[cur.sigla]){regList();return}if(!t){const cs=CAP[cur.sigla]||[];list.innerHTML=cs.length?'':'<p class="g-note">'+T('type')+'</p>';cs.forEach(c=>{const b=document.createElement('button');b.className='g-it';b.innerHTML='<i style="background:#c9a45c"></i>'+tc(c.n)+'<em>'+c.c+'</em>';b.onclick=()=>{const m=munData.find(x=>x.id===c.m[0]);m?pick(m):0};list.appendChild(b)});return}
    munData.filter(m=>m.n.toLowerCase().includes(t)).slice(0,30).forEach(m=>{const b=document.createElement('button');b.className='g-it';b.innerHTML=m.n+'<em>'+(m.rgi||'')+'</em>';b.onclick=()=>pick(m);list.appendChild(b)})}}
function pick(m){svg.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));if(m.el){m.el.classList.add('sel');m.el.parentNode.appendChild(m.el)}
  card.hidden=false;card.innerHTML='<b>'+m.n+'</b><br>'+cur.nome+' · '+cur.sigla+(REGON&&RG&&RG[cur.sigla]&&RG[cur.sigla].m[m.id]!==undefined?'<br>'+T('rgIn')+': '+esc(RG[cur.sigla].r[RG[cur.sigla].m[m.id]]):'')+'<br>'+T('area')+': '+fmt(Math.round(m.a))+' km²'+(m.rgi?'<br>'+T('rgi')+': '+m.rgi:'')+'<br>'+T('ibge')+': '+m.id+(m.cap?m.cap.map(c=>'<hr style="border:0;border-top:1px solid var(--g-line);margin:8px 0"><b style="color:var(--g-gold)">'+T('chap')+' '+tc(c.n)+' ('+c.c+')</b><br>'+T('pres')+': '+c.p+'<br><a href="tel:'+c.t.replace(/[^\d+]/g,'')+'">'+c.t+'</a>').join(''):'')+
    (cur.sigla==='SC'?'<br><a href="../beta/">'+T('openSC')+'</a>':'')}
async function openUF(s){
  const u=UF.find(x=>x.sigla===s);setUrl({pais:'BRA',uf:s});globeOff();cur=u;lvl='uf';svg.innerHTML='';crumbs();
  head(u.nome,T('loading'),T('muni'),T('searchM'));
  view(bboxB(u.p,100),.04);mk(dB(u.p,100),PAL[u.col],'dim').style.opacity=.5;
  try{munData=munCache[s]||(munCache[s]=await (await fetch('data/mun/'+s+'.json')).json())}catch(e){$('gSub').textContent='Não foi possível carregar os municípios.';return}
  if(cur!==u)return;svg.innerHTML='';const base=PAL[u.col],all=[];
  munData.forEach((m,i)=>{const mc=(CAP[s]||[]).filter(c=>c.m.includes(m.id));if(mc.length)m.cap=mc;const p=mk(dB(m.p,1000),mc.length?'#c9a45c':CAP[s]?'#6f89ad':base,'mu'+(mc.length?' hc':''));p.style.opacity=mc.length?1:(CAP[s]?.38:.78+((i*37)%5)*.055);m.el=p;m.f0=p.getAttribute('fill');m.o0=p.style.opacity;all.push.apply(all,m.p);
    p.addEventListener('mousemove',e=>showTip(e,'<b>'+m.n+'</b><small>'+fmt(Math.round(m.a))+' km²'+(REGON&&RG&&RG[s]&&RG[s].m[m.id]!==undefined?' · '+esc(RG[s].r[RG[s].m[m.id]]):'')+'</small>'));p.addEventListener('mouseleave',hide);p.addEventListener('click',()=>pick(m))});
  view(bboxB(all,1000),.03);$('gSub').textContent=munData.length+' '+T('mSub');
  applyReg();stats(CAP[s]?[[munData.length,T('muni')],[CAP[s].length,T('chap')],[u.reg,T('region')]]:[[munData.length,T('muni')],[fmt(Math.round(u.area)),'km²'],[u.reg,T('region')]]);renderList()}
q.addEventListener('input',renderList);back.onclick=()=>{if(lvl==='uf')drawBR();else{if(lvl==='br'){G.lon=-52;G.lat=-14;G.k=2.3}drawWorld()}};
$('gTheme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('adh-tema',n)}catch(e){}};
$('gIntro').onclick=()=>{document.documentElement.classList.remove('app-on');$('stage').classList.remove('gone');window.__play&&window.__play()};

const FLAGS={
pt:['Português','<svg viewBox="0 0 72 50"><rect width="72" height="50" fill="#229e45"/><path d="M36 5 67 25 36 45 5 25Z" fill="#f8d90f"/><circle cx="36" cy="25" r="10.5" fill="#2b3f87"/><path d="M26 22.5c7-2 15-.5 20 4" stroke="#fff" stroke-width="2" fill="none"/></svg>'],
es:['Español','<svg viewBox="0 0 72 50"><rect width="72" height="50" fill="#c60b1e"/><rect y="12.5" width="72" height="25" fill="#ffc400"/></svg>'],
en:['English','<svg viewBox="0 0 72 50"><rect width="72" height="50" fill="#fff"/><g fill="#b22234"><rect width="72" height="3.85"/><rect y="7.7" width="72" height="3.85"/><rect y="15.4" width="72" height="3.85"/><rect y="23.1" width="72" height="3.85"/><rect y="30.8" width="72" height="3.85"/><rect y="38.5" width="72" height="3.85"/><rect y="46.2" width="72" height="3.8"/></g><rect width="32" height="27" fill="#3c3b6e"/><g fill="#fff"><circle cx="6" cy="5" r="1.2"/><circle cx="14" cy="5" r="1.2"/><circle cx="22" cy="5" r="1.2"/><circle cx="10" cy="11" r="1.2"/><circle cx="18" cy="11" r="1.2"/><circle cx="26" cy="11" r="1.2"/><circle cx="6" cy="17" r="1.2"/><circle cx="14" cy="17" r="1.2"/><circle cx="22" cy="17" r="1.2"/><circle cx="10" cy="22.5" r="1.2"/><circle cx="18" cy="22.5" r="1.2"/><circle cx="26" cy="22.5" r="1.2"/></g></svg>'],
fr:['Français','<svg viewBox="0 0 72 50"><rect width="24" height="50" fill="#0055a4"/><rect x="24" width="24" height="50" fill="#fff"/><rect x="48" width="24" height="50" fill="#ef4135"/></svg>']};
(function(){const fl=$('flags');Object.keys(FLAGS).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='fl';b.lang=k;b.setAttribute('aria-label',FLAGS[k][0]);b.innerHTML=FLAGS[k][1]+'<span>'+FLAGS[k][0]+'</span>';b.onclick=()=>{setLang(k);document.documentElement.classList.add('app-on');$('stage').classList.add('gone');scrollTo(0,0)};fl.appendChild(b)})})();

const J=u=>fetch(u).then(r=>r.json());
Promise.all([J('data/regioes.json').catch(()=>null),J('data/capitulos.json').catch(()=>({})),J('data/conteudo.json').catch(()=>CT),J('data/world.json'),J('data/paises.json'),J('data/uf.json'),J('data/adhonep.json')]).then(r=>{RG=r[0];CAP=r[1];CT=r[2];W=r[3];PI=r[4];UF=r[5];ADH=new Set(r[6]);applyStatic();drawWorld();deepLink()}).catch(()=>{$('gSub').textContent='Abra por um servidor HTTP (não direto pelo arquivo).'});
})();

</script>
